[theme]
base = "light"
primaryColor = "#2e7d32"

[server]
# Matches src/disease_detection/preprocessing.py MAX_FILE_BYTES (15 MB).
maxUploadSize = 15
# Keep Streamlit's built-in protections on (these are the defaults, stated explicitly).
enableXsrfProtection = true
enableCORS = true

[client]
# Unexpected errors show only the error type to users, not tracebacks or file paths.
# For local debugging, change this to "full".
showErrorDetails = "type"
